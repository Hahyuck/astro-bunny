<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTRO BUNNY · 동작·배경·효과 미리보기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100f21;color:#f3ddec;font:15px/1.55 system-ui,sans-serif}main{max-width:970px;margin:32px auto;padding:0 20px}h1{font-size:25px;margin:0 0 6px}p{color:#b08aba;margin:0 0 20px}.layout{display:grid;grid-template-columns:minmax(260px,512px) minmax(230px,1fr);gap:24px;align-items:start}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#100f21;border:1px solid #514365;border-radius:5px}.panel{padding:18px;background:#1b1933;border:1px solid #3b3355;border-radius:12px}nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}button,input{font:inherit}button{color:#f3ddec;background:#292541;border:1px solid #715581;border-radius:7px;padding:10px 12px;cursor:pointer}button[aria-pressed=true]{background:#503572;border-color:#ff81be;color:#fff1ee}button:hover{border-color:#68c9bd}button:focus-visible,input:focus-visible{outline:2px solid #68c9bd;outline-offset:3px}.controls{display:flex;gap:8px;margin:12px 0}label{display:block;color:#d0afd7}input[type=range]{width:100%;accent-color:#ff81be}input[type=number]{width:84px;background:#100f21;color:#f3ddec;border:1px solid #715581;border-radius:4px;padding:5px}output{font-variant-numeric:tabular-nums}#detail{min-height:4.7em;margin-top:15px;font-size:13px}#status{display:block;color:#68c9bd;font-size:13px;margin-top:12px}small{color:#956b9e}.disabled{pointer-events:none;opacity:.5}@media(max-width:730px){main{margin-top:18px}.layout{grid-template-columns:1fr}.panel{padding:14px}canvas{max-width:512px;margin:auto}}
</style></head><body><main>
<h1>동작·배경·효과 미리보기</h1><p>기본 리소스를 사용하는 별도 시연입니다. 실제 게임 진행·점수·교체 설정에는 영향을 주지 않습니다.</p>
<div class="layout"><canvas id="preview" width="512" height="480" aria-label="동작·배경·피격 효과 WebGL 미리보기"></canvas>
<section class="panel disabled" id="panel" aria-label="미리보기 조작">
<nav aria-label="장면 선택"><button data-scene="walk">정면 걷기</button><button data-scene="sky">별·유성</button><button data-scene="roar">바니 포효</button><button data-scene="enemy">적 명중</button><button data-scene="armor">장갑 충돌</button><button data-scene="player">내 피격</button><button data-scene="pickup">분신 획득</button><button data-scene="boss">대형 파괴</button></nav>
<strong id="scene-title">불러오는 중</strong><div class="controls"><button id="play">재생</button><button id="pause">정지</button><button id="restart">다시 보기</button></div>
<label for="timeline">현재 프레임 <output id="frame-label">0 / 0</output></label><input id="timeline" type="range" min="0" max="95" value="0" step="1">
<div><label for="frame-input" style="display:inline">프레임 지정</label> <input id="frame-input" type="number" min="0" max="95" value="0" step="1"> <button id="apply-frame">프레임 적용</button></div>
<p id="detail"></p><small>프레임을 지정하면 정지합니다. 60프레임은 1초입니다.</small><output id="status" role="status">리소스를 불러오는 중입니다.</output>
</section></div></main><script type="module" src="./effects-preview.js"></script></body></html>
